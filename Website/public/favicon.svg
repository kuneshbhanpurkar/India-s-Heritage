<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA4E18"/>
      <stop offset="100%" stop-color="#7B2C06"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE181"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with Rich Terracotta Gradient -->
  <circle cx="256" cy="256" r="236" fill="url(#terracottaGrad)" />

  <!-- Gold Heritage Outer Ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Heritage Architecture Motif -->
  <!-- Base Stepped Platform -->
  <rect x="136" y="360" width="240" height="20" rx="4" fill="#FFF5E6" filter="url(#shadow)"/>
  <rect x="156" y="348" width="200" height="14" rx="2" fill="#FFE8CC"/>

  <!-- Columns / Pillars -->
  <rect x="164" y="240" width="16" height="110" rx="3" fill="#FFF5E6"/>
  <rect x="212" y="240" width="16" height="110" rx="3" fill="#FFF5E6"/>
  <rect x="284" y="240" width="16" height="110" rx="3" fill="#FFF5E6"/>
  <rect x="332" y="240" width="16" height="110" rx="3" fill="#FFF5E6"/>

  <!-- Central Heritage Arch -->
  <path d="M 220 348 L 220 280 C 220 255, 292 255, 292 280 L 292 348 Z" fill="url(#terracottaGrad)"/>
  <path d="M 228 348 L 228 285 C 228 265, 284 265, 284 285 L 284 348 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Shikhara / Central Majestic Heritage Dome -->
  <path d="M 170 240 Q 210 160, 256 120 Q 302 160, 342 240 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
  
  <!-- Architectural Fluting lines on Dome -->
  <path d="M 210 240 Q 235 170, 256 120" stroke="#AA820A" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 302 240 Q 277 170, 256 120" stroke="#AA820A" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Kalash & Pinnacle Spire -->
  <circle cx="256" cy="110" r="10" fill="#FFF5E6"/>
  <ellipse cx="256" cy="98" rx="7" ry="5" fill="url(#goldGrad)"/>
  <line x1="256" y1="94" x2="256" y2="76" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>
